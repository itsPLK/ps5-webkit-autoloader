<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>WebKit Autoloader v[[VERSION_PLACEHOLDER]] by PLK (built [[BUILD_TIME_PLACEHOLDER]])</title>
<body style="background:#111;color:#eee;font:24px sans-serif;margin:10%">
<p id="status">Loading...</p>
<script>
(function () {
  var version = '[[VERSION_PLACEHOLDER]]';
  var base = '/app/[[APP_DIR_PLACEHOLDER]]/';

  var match = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
  var params = typeof location !== 'undefined' && location.search ? new URLSearchParams(location.search) : null;
  var fwArg = params ? params.get('fw') : null;
  if (!match && fwArg) {
    match = ['PlayStation 5/' + fwArg, fwArg];
  }
  var fw = match ? parseFloat(match[1]) : 0;

  if (match && (fw < 7.00 || fw > 13.60)) {
    document.getElementById('status').textContent = 'Unsupported firmware ' + match[1] + '.';
    return;
  }

  fetch(base + '__complete__').then(function (r) { return r.text(); }).then(function (marker) {
    if (marker.trim() !== version) throw new Error('Cache incomplete');
    var target = base + 'index.html';
    if (fwArg) target += '?fw=' + encodeURIComponent(fwArg);
    location.replace(target);
  }).catch(function () {
    document.getElementById('status').textContent = 'Cache incomplete. Run the installer again.';
  });
})();
</script>
</body>
</html>
